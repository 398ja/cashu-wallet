# Cashu Wallet Client Default Configuration
#
# Virtual Thread support (Java 21+)
# Enable VT by default. Override via environment variable:
#   CASHU_WALLET_VIRTUAL_THREADS_ENABLED=false
# Or via JVM property:
#   -Dspring.threads.virtual.enabled=false
spring.threads.virtual.enabled=${CASHU_WALLET_VIRTUAL_THREADS_ENABLED:true}
